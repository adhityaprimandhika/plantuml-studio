services:
  plantuml:
    image: plantuml/plantuml-server:jetty
    restart: unless-stopped
    expose:
      - "8080"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - PLANTUML_SERVER_URL=http://plantuml:8080
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma2:2b}
    extra_hosts:
      - "host.docker.internal:172.16.2.1"
    depends_on:
      - plantuml
